[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jiaowen09-long_context_positional_extrapolation_coverage_map"
version = "0.1.0"
description = "把候选项映射到类别上，算出大模型推理优化工程师·长上下文的位置编码外推的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jiaowen09" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jiaowen09.github.io"
Repository = "https://github.com/jiaowen09/long_context_positional_extrapolation_coverage_map"
Issues = "https://github.com/jiaowen09/long_context_positional_extrapolation_coverage_map/issues"

[project.scripts]
long_context_positional_extrapolation_coverage_map = "long_context_positional_extrapolation_coverage_map:main"

[tool.setuptools]
py-modules = ["long_context_positional_extrapolation_coverage_map"]
